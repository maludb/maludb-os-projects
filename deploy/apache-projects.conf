# Projects — an application from us beside the Business OS kernel (mcp-and-api.md §7).
# Two virtual hosts: the public name for people (and the two proxied MCP servers), and a loopback
# port for the kernel's actions server and approval replays. Copy to
# /etc/apache2/sites-available/projects.conf, `a2ensite projects`, `systemctl reload apache2`.
# The ports come from config/.env: APP_INTERNAL_PORT 8181, MCP_RECORDS_PORT 8823, MCP_ACTIVITY_PORT 8824.

<VirtualHost *:80>
	ServerName projects.subello.com
	DocumentRoot /srv/apps/projects/html
	ErrorLog ${APACHE_LOG_DIR}/projects-error.log
	CustomLog ${APACHE_LOG_DIR}/projects-access.log combined
	SetEnvIf X-Forwarded-Proto "https" HTTPS=on

	<Directory /srv/apps/projects/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	# Attachments are served by PHP through the gate, never from disk: storage/ is outside the document root.

	# The two read MCP servers, under the application's name. Host is NOT preserved (the SDK's
	# DNS-rebinding guard checks it against loopback).
	ProxyPreserveHost Off
	ProxyPass        /mcp/records  http://127.0.0.1:8823/mcp
	ProxyPassReverse /mcp/records  http://127.0.0.1:8823/mcp
	ProxyPass        /mcp/activity http://127.0.0.1:8824/mcp
	ProxyPassReverse /mcp/activity http://127.0.0.1:8824/mcp

	RewriteEngine On
	RewriteRule ^/mcp/(records|activity)(/|$) - [L]

	# The health check: only this answers under /api.
	RewriteRule ^/api/v1/health/?$ /api/v1/health.php [L,QSA]
	RewriteRule ^/api/v1/health\.php$ - [L]
	RewriteRule ^/api/ - [R=404,L]

	# The sign-on receivers.
	RewriteRule ^/sso$ /sso.php [L,QSA]
	RewriteRule ^/sso/logout$ /sso/logout.php [L,QSA]

	# Canonical URLs (the action manifest, docs/projects-design.md §6).
	# A project by key: /projects/{KEY} and its sections.
	RewriteRule ^/projects/new$ /projects/form.php [L,QSA]
	RewriteRule ^/projects/([A-Z][A-Z0-9]{1,9})/edit$ /projects/form.php?key=$1 [L,QSA]
	RewriteRule ^/projects/([A-Z][A-Z0-9]{1,9})/(backlog|board|sprints|epics|issues|reports|settings)$ /projects/$2.php?key=$1 [L,QSA]
	RewriteRule ^/projects/([A-Z][A-Z0-9]{1,9})$ /projects/view.php?key=$1 [L,QSA]
	# An issue by key: /issues/{KEY-n}.
	RewriteRule ^/issues/new$ /issues/form.php [L,QSA]
	RewriteRule ^/issues/([A-Z][A-Z0-9]{1,9}-[0-9]+)/edit$ /issues/form.php?key=$1 [L,QSA]
	RewriteRule ^/issues/([A-Z][A-Z0-9]{1,9}-[0-9]+)$ /issues/view.php?key=$1 [L,QSA]
	# Sprints and epics by id; my work; the trail.
	RewriteRule ^/sprints/([0-9]+)$ /sprints/view.php?id=$1 [L,QSA]
	RewriteRule ^/epics/([0-9]+)$ /epics/view.php?id=$1 [L,QSA]
	RewriteRule ^/my-work$ /my-work.php [L,QSA]
	RewriteRule ^/activity$ /activity.php [L,QSA]
	# The generic forms: /x/new → form.php, /x/{id}/edit → form.php?id=, /x/{id} → view.php?id=.
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>

# PHP on the internal port, for the kernel's actions server and approval replays only.
Listen 127.0.0.1:8181
<VirtualHost 127.0.0.1:8181>
	DocumentRoot /srv/apps/projects/html
	ErrorLog ${APACHE_LOG_DIR}/projects-error.log
	CustomLog ${APACHE_LOG_DIR}/projects-access.log combined
	<Directory /srv/apps/projects/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>
	RewriteEngine On
	RewriteRule ^/api/v1/health/?$ /api/v1/health.php [L,QSA]
	RewriteRule ^/projects/new$ /projects/form.php [L,QSA]
	RewriteRule ^/projects/([A-Z][A-Z0-9]{1,9})/edit$ /projects/form.php?key=$1 [L,QSA]
	RewriteRule ^/projects/([A-Z][A-Z0-9]{1,9})/(backlog|board|sprints|epics|issues|reports|settings)$ /projects/$2.php?key=$1 [L,QSA]
	RewriteRule ^/projects/([A-Z][A-Z0-9]{1,9})$ /projects/view.php?key=$1 [L,QSA]
	RewriteRule ^/issues/new$ /issues/form.php [L,QSA]
	RewriteRule ^/issues/([A-Z][A-Z0-9]{1,9}-[0-9]+)/edit$ /issues/form.php?key=$1 [L,QSA]
	RewriteRule ^/issues/([A-Z][A-Z0-9]{1,9}-[0-9]+)$ /issues/view.php?key=$1 [L,QSA]
	RewriteRule ^/sprints/([0-9]+)$ /sprints/view.php?id=$1 [L,QSA]
	RewriteRule ^/epics/([0-9]+)$ /epics/view.php?id=$1 [L,QSA]
	RewriteRule ^/my-work$ /my-work.php [L,QSA]
	RewriteRule ^/activity$ /activity.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>
